name: TaskBoard Python CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image owner (GHCR names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t ghcr.io/${{ env.OWNER }}/taskboard-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/${{ env.OWNER }}/taskboard-frontend:${{ github.sha }} ./frontend
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
          trivy --version
      - name: Scan backend
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ghcr.io/${{ env.OWNER }}/taskboard-backend:${{ github.sha }}
      - name: Scan frontend
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ghcr.io/${{ env.OWNER }}/taskboard-frontend:${{ github.sha }}
      - name: Push images
        run: |
          docker push ghcr.io/${{ env.OWNER }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER }}/taskboard-frontend:${{ github.sha }}
  deploy:
    # Needs a reachable cluster: set repo variable DEPLOY_ENABLED=true and secret KUBE_CONFIG_DATA.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image owner (GHCR names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env: {KUBE_CONFIG_DATA: '${{ secrets.KUBE_CONFIG_DATA }}'}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ env.OWNER }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ env.OWNER }}/taskboard-frontend
