# Local classroom cluster: one node labelled for ingress-nginx, with host ports 80/443 mapped.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taskboard
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
