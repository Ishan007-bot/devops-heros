apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels: {app: taskboard-backend}
spec:
  selector: {app: taskboard-backend}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
# The frontend Nginx config proxies /api to http://backend:8000 (the compose service name).
# This alias gives that hostname the same meaning inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: taskboard-backend}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
